<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhắc Uống Thuốc</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f766e" />
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    button {
      padding: 12px 16px;
      font-size: 15px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    #btn-sub { background: #0f766e; color: #fff; }
    #btn-test { background: #1d4ed8; color: #fff; }
    pre {
      background: #f4f4f5;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>Hộp Thuốc Thông Minh - Test Push</h2>
  <p>1. Trên iPhone, hãy mở bằng Safari -> <b>Share</b> -> <b>Add to Home Screen</b> rồi mở từ màn hình chính.</p>
  <p>2. Bấm nút dưới để bật thông báo và đăng ký thiết bị.</p>

  <button id="btn-sub">Bật thông báo</button>
  <button id="btn-test">Giả lập hộp thuốc báo 5 lần</button>

  <h3>Trạng thái & Subscription JSON:</h3>
  <pre id="status">Chưa đăng ký</pre>

  <script src="./app.js"></script>
</body>
</html>
