<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lời mời tham gia Cộng đồng</title>

    <!-- Các thẻ Open Graph cơ bản -->
    <meta property="og:title" content="Tham gia Máy chủ Discord của chúng tôi!">
    <meta property="og:description" content="Có 1,250 thành viên đang hoạt động trực tuyến.">
    <meta property="og:image" content="https://i.imgur.com/fKL21y5.png">

    <!-- Thẻ Component Embed giả lập Lời mời (Invite) -->
    <script id="discord:component-embed" type="application/json">
    {
      "component": {
        "type": 17,
        "spoiler": false,
        "accent_color": 5793266,
        "components": [
          {
            "type": 12,
            "items": [
              { "media": { "url": "https://karasu.io.vn/assets/guildBanner.png" } }
            ]
          },
          { "type": 14, "divider": false, "spacing": "large" },
          {
            "type": 9,
            "components": [
              {
                "type": 10,
                "content": "# [Mc's Community](https://karasu.io.vn/discord)"
              }
            ],
            "accessory": {
              "type": 2,
              "style": 5,
              "url": "https://karasu.io.vn/discord",
              "label": "Join"
            }
          },
          {
            "type": 9,
            "components": [
              {
                "type": 10,
                "content": "Nó chỉ là một máy chủ bình thường như bao máy chủ khác (it's just a normal server like any other)."
              }
            ],
            "accessory": {
              "type": 11,
              "media": { "url": "https://karasu.io.vn/assets/empty.png" }
            }
          }
        ]
      }
    }
    </script>
</head>
<body>
    <h1>Trang web chia sẻ lời mời</h1>
</body>
</html>
